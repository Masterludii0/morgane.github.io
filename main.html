<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saint Valentin</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
        background: linear-gradient(135deg, #ecacbe, #e2426a, #ecacbe);
        height: 100vh;
    }

    /* CONTENEUR DES COEURS (VRAI FOND) */
    #heartsContainer {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }

    /* OVERLAY */
    #overlay {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #ecacbe, #e2426a, #ecacbe);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: opacity 1s ease;
        gap: 25px;
    }

    #overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    h1 {
        color: white;
        font-size: 3rem;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    button {
        padding: 20px 50px;
        font-size: 1.5rem;
        border: none;
        border-radius: 50px;
        background: white;
        color: #c9184a;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 20px rgba(255,255,255,0.6);
    }

    #enterBtn {
        transition: transform 0.3s ease;
    }

    /* HEARTS */
    .heart {
        position: absolute;
        width: 20px;
        height: 20px;
        background: red;
        transform: rotate(45deg);
        animation: float 8s linear infinite;
        opacity: 0.8;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: red;
        border-radius: 50%;
    }

    .heart::before { top: -10px; }
    .heart::after { left: -10px; }

    @keyframes float {
        0% { transform: translateY(110vh) rotate(45deg); }
        100% { transform: translateY(-20vh) rotate(45deg); }
    }

    /* CONTENT */
    #content {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        position: relative;
        z-index: 1;
    }

    video {
        max-width: 80%;
        border-radius: 20px;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
</style>
</head>

<body>

<!-- FOND DE COEURS -->
<div id="heartsContainer"></div>

<div id="overlay">
    <h1>❤️ Veux-tu être ma valentine ? ❤️</h1>

    <button id="enterBtn" onclick="enterSite()">OUI !!</button>

    <button onclick="growButton()">Non.</button>
</div>

<div id="content">
    <video controls>
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<script>
let scale = 1;

function enterSite() {
    document.getElementById("overlay").classList.add("hidden");
}

function growButton() {
    scale += 0.2;
    document.getElementById("enterBtn").style.transform = `scale(${scale})`;
}

// Générer des coeurs en VRAI fond
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (5 + Math.random() * 5) + "s";

    document.getElementById("heartsContainer").appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
